<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер штрихкодов</title>
    <!-- Подключаем Tailwind для стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем библиотеку для сканирования HTML5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: 2px solid var(--tg-theme-button-color, #3390ec); border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <div class="text-center w-full max-w-md">
        <h1 class="text-xl font-bold mb-4">Наведите камеру на штрихкод</h1>
        <div id="reader"></div>
        <p id="status" class="mt-4 text-sm opacity-70">Инициализация камеры...</p>
        
        <button id="close-btn" class="mt-6 w-full py-3 px-4 bg-gray-200 text-gray-800 rounded-xl font-semibold shadow-sm hidden" onclick="Telegram.WebApp.close()">
            Закрыть
        </button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const statusText = document.getElementById('status');
        const closeBtn = document.getElementById('close-btn');

        function onScanSuccess(decodedText, decodedResult) {
            // Если сканирование успешно, отправляем данные обратно в бота
            statusText.innerText = "Штрихкод найден! Отправляем...";
            statusText.className = "mt-4 text-sm text-green-500 font-bold";
            
            // Вибрация телефона при успешном сканировании (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }

            // Отправляем текст в бота
            tg.sendData(decodedText);
        }

        function onScanFailure(error) {
            // Ошибки сканирования происходят постоянно (когда код не в фокусе), 
            // поэтому мы их просто игнорируем, чтобы не спамить в консоль.
        }

        // Настройка сканера
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: {width: 250, height: 150}, aspectRatio: 1.0 },
            /* verbose= */ false);
            
        // Запуск сканера
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        
        statusText.innerText = "Поиск штрихкода...";
        closeBtn.classList.remove('hidden');
    </script>
</body>
</html>
